services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: bharatai
      POSTGRES_USER: bharatai
      POSTGRES_PASSWORD: change-me
    volumes: [bharatai_pg:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://bharatai:change-me@postgres:5432/bharatai
      REDIS_URL: redis://redis:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_REQUIRED: "true"
      API_CORS_ORIGIN: ${API_CORS_ORIGIN}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      ENVIRONMENT: production
    depends_on: [postgres,redis]
    ports: ["8000:8000"]
volumes:
  bharatai_pg:
