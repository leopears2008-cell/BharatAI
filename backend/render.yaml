services:
  - type: web
    name: bharatai-api
    runtime: docker
    rootDir: backend
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AUTH_REQUIRED
        value: "true"
      - key: API_CORS_ORIGIN
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: ENVIRONMENT
        value: production
